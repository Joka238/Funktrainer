name: Spracherkennung messen

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/eval-stt.mjs'
      - 'src/js/asr-core.js'
      - '.github/workflows/stt-eval.yml'

jobs:
  eval:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Modelle zwischenspeichern
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-eval-models-v1
      - run: node scripts/eval-stt.mjs
