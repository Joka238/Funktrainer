name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sprachmodell zwischenspeichern
        uses: actions/cache@v4
        with:
          path: src/models
          key: whisper-small-v1
      - name: Sprachmodell in die App einbauen
        run: node scripts/fetch-model.js Xenova/whisper-small
      - name: App bauen
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: funktrainer-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  # Veröffentlicht die Pakete als GitHub-Release mit festen Download-Links
  # (…/releases/latest/download/BOS-Funktrainer-Setup.exe bzw. BOS-Funktrainer.dmg)
  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          name: BOS Funktrainer ${{ steps.v.outputs.version }}
          make_latest: true
          overwrite_files: true
          body: |
            **Download:**
            - Windows: `BOS-Funktrainer-Setup.exe` (Installer) oder `BOS-Funktrainer-Portable.exe` (ohne Installation)
            - macOS: `BOS-Funktrainer.dmg` (Apple Silicon & Intel)

            **macOS – einfachste Installation (ohne Apple-Warnung):** Terminal öffnen und eingeben:
            `curl -fsSL https://github.com/Joka238/Funktrainer/releases/latest/download/install-mac.sh | bash`

            **macOS – per DMG, erster Start:** Bei der Warnung „Apple konnte nicht überprüfen …“ auf *Fertig* klicken,
            dann *Systemeinstellungen → Datenschutz & Sicherheit* → ganz unten *Dennoch öffnen*. Nur einmal nötig.

            **Windows:** Bei „Der Computer wurde durch Windows geschützt“ auf *Weitere Informationen → Trotzdem ausführen*.

            Installationshinweise siehe README.
          files: |
            artifacts/*
            install-mac.sh
